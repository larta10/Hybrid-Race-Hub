name: Instagram diario

on:
  schedule:
    # 17:47 UTC = 18:47 en Madrid en horario de invierno (19:47 en verano)
    - cron: "47 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prueba sin publicar (renderiza y sube el reel o las imágenes y registra dry_run)"
        type: boolean
        default: true
      fecha:
        description: "Solo en prueba: simular otro día (YYYY-MM-DD)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Chromium de Remotion (chrome-headless-shell) y ffmpeg
      - name: Dependencias de sistema para el render de vídeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libcups2
          ffmpeg -version | head -1

      # node_modules de video/ incluye el navegador de Remotion (node_modules/.remotion)
      - name: Caché de dependencias de vídeo
        id: video-deps
        uses: actions/cache@v4
        with:
          path: video/node_modules
          key: video-deps-${{ runner.os }}-${{ hashFiles('video/package-lock.json') }}

      - name: Instalar dependencias de vídeo
        if: steps.video-deps.outputs.cache-hit != 'true'
        working-directory: video
        run: npm ci

      # Clips verticales ya preparados (si faltan, se bajan de nuestro bucket, nunca de Pixabay)
      - name: Caché de clips
        uses: actions/cache@v4
        with:
          path: video/cache
          key: video-clips-${{ hashFiles('instagram/reels/*.json') }}
          restore-keys: video-clips-

      - name: Publicar reel o carrusel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_DATE: ${{ inputs.fecha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/instagram/publish.mjs

      # GitHub desactiva los cron de repos sin actividad en 60 días: un commit vacío lo evita
      - name: Keepalive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ($(date +%s) - last) / 86400 ))
          echo "Último commit hace $age días"
          if [ "$age" -gt 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive instagram"
            git push
          fi
