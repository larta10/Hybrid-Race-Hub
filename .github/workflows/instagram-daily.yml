name: Instagram diario

on:
  schedule:
    # 17:47 UTC = 18:47 en Madrid en horario de invierno (19:47 en verano)
    - cron: "47 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prueba sin publicar (renderiza y sube el reel o las imágenes y registra dry_run)"
        type: boolean
        default: true
      fecha:
        description: "Solo en prueba: simular otro día (YYYY-MM-DD)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Chromium de Remotion (chrome-headless-shell) y ffmpeg
      - name: Dependencias de sistema para el render de vídeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libcups2
          ffmpeg -version | head -1

      # node_modules de video/ incluye el navegador de Remotion (node_modules/.remotion)
      - name: Caché de dependencias de vídeo
        id: video-deps
        uses: actions/cache@v4
        with:
          path: video/node_modules
          key: video-deps-${{ runner.os }}-${{ hashFiles('video/package-lock.json') }}

      - name: Instalar dependencias de vídeo
        if: steps.video-deps.outputs.cache-hit != 'true'
        working-directory: video
        run: npm ci

      # Clips verticales ya preparados (si faltan, se bajan de nuestro bucket, nunca de Pixabay)
      - name: Caché de clips
        uses: actions/cache@v4
        with:
          path: video/cache
          key: video-clips-${{ hashFiles('instagram/reels/*.json') }}
          restore-keys: video-clips-

      # Narración: Kokoro-82M (voz local, Apache-2.0) y faster-whisper (tiempos por palabra), gratis y sin claves.
      # Solo hace falta si cambia un guion o la voz: el audio ya generado está en el repo.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video/requirements-voz.txt

      - name: Instalar Kokoro, Piper y faster-whisper
        run: pip install -q -r video/requirements-voz.txt

      # Modelo de Kokoro (~350 MB, releases públicas de GitHub, SHA-256 fijado en motores.py), voces de Piper y Whisper
      - name: Caché de modelos de voz y de Whisper
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hrh-modelos
            ~/.cache/hrh-voces
            ~/.cache/hrh-whisper
          key: voz-modelos-v2-${{ hashFiles('instagram/reels/voz.json', 'video/scripts/motores.py') }}
          restore-keys: voz-modelos-v2-

      # Solo genera el audio si falta o si cambió el texto o la voz (el hash está en words.json).
      # Si falla, el reel sale sin voz: el paso no bloquea la publicación.
      - name: Narración de los reels
        continue-on-error: true
        timeout-minutes: 45
        env:
          PIPER_VOICES_DIR: ~/.cache/hrh-voces
          WHISPER_MODELS_DIR: ~/.cache/hrh-whisper
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: |
          export PIPER_VOICES_DIR="$HOME/.cache/hrh-voces" WHISPER_MODELS_DIR="$HOME/.cache/hrh-whisper" HRH_MODELS_DIR="$HOME/.cache/hrh-modelos"
          ids=$(grep -l '"narracion"' instagram/reels/r[0-9]*.json | xargs -n1 basename | sed 's/\.json$//')
          [ -n "$ids" ] && python video/scripts/narrar.py $ids

      # Solo en pruebas: comprueba que la voz configurada genera audio en Linux (por si un día hay que regenerar)
      - name: Prueba de la voz
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export PIPER_VOICES_DIR="$HOME/.cache/hrh-voces" HRH_MODELS_DIR="$HOME/.cache/hrh-modelos"
          python -I - <<'EOF'
          import json, sys, time
          sys.path.insert(0, "video/scripts")
          import motores
          cfg = json.load(open("instagram/reels/voz.json", encoding="utf-8"))
          t = time.time()
          m = motores.cargar_motor(cfg)
          sr, pcm = motores.sintetizar_frase(m, cfg, "¿Tu primer Jai rox? Esto te espera.")
          print(f"{motores.nombre_voz(cfg)}: {len(pcm) / 2 / sr:.1f} s de audio a {sr} Hz en {time.time() - t:.0f} s")
          assert len(pcm) / 2 / sr > 1.0
          EOF

      - name: Publicar reel o carrusel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_DATE: ${{ inputs.fecha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/instagram/publish.mjs

      # GitHub desactiva los cron de repos sin actividad en 60 días: un commit vacío lo evita
      - name: Keepalive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ($(date +%s) - last) / 86400 ))
          echo "Último commit hace $age días"
          if [ "$age" -gt 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive instagram"
            git push
          fi
